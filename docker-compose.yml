services:
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d authdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  finance-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: financedb
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
    ports:
      - "5434:5432"
    volumes:
      - finance-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d financedb"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - auth-service
      - finance-service
      - reports-service

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-shared-secret-for-local-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/authdb
      SPRING_DATASOURCE_USERNAME: finance
      SPRING_DATASOURCE_PASSWORD: finance
    ports:
      - "8081:8081"
    depends_on:
      auth-db:
        condition: service_healthy

  finance-service:
    build:
      context: .
      dockerfile: finance-service/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-shared-secret-for-local-dev}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-local-internal-token}
      SPRING_DATASOURCE_URL: jdbc:postgresql://finance-db:5432/financedb
      SPRING_DATASOURCE_USERNAME: finance
      SPRING_DATASOURCE_PASSWORD: finance
    ports:
      - "8082:8082"
    depends_on:
      finance-db:
        condition: service_healthy

  reports-service:
    build:
      context: .
      dockerfile: reports-service/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-shared-secret-for-local-dev}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-local-internal-token}
      FINANCE_SERVICE_URL: http://finance-service:8082
    ports:
      - "8083:8083"
    depends_on:
      - finance-service

volumes:
  auth-db-data:
  finance-db-data:
